<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Room 77</title>
<meta name="description" content="This page wandered off. Even Muchacho couldn't sniff it out.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070607">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  .nf{min-height:70vh;display:flex;align-items:center;padding:clamp(48px,8vw,110px) clamp(16px,4vw,48px)}
  .nf-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,64px);align-items:center;max-width:1000px;margin:0 auto;width:100%}
  .nf-code{font-family:var(--font-display);font-size:clamp(80px,16vw,180px);line-height:.8;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--color-text) 84%,transparent);margin:0}
  .nf h1{font-family:var(--font-display);font-size:clamp(24px,3.4vw,44px);line-height:1.05;letter-spacing:-.02em;margin:18px 0 0}
  .nf p.lead{margin-top:16px;max-width:46ch}
  .nf .actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
  .nf-photo img{width:100%;max-width:360px;border-radius:14px;display:block;margin-left:auto;filter:saturate(1.02)}
  .nf-cap{margin:12px 0 0;text-align:right;font-size:13px;color:var(--color-dim)}
  @media(max-width:720px){.nf-grid{grid-template-columns:1fr;text-align:center}.nf-photo img{margin:0 auto}.nf-cap{text-align:center}.nf .actions{justify-content:center}.nf-code{margin:0 auto}}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="brand"><img src="/assets/logo-77-events.png" alt="Room 77 Events"></a>
  <button class="nav-toggle" aria-label="Menu" aria-expanded="false">&#9776;</button>
  <div class="nav-links" id="navlinks">
    <a href="/travel/">Book Resorts &amp; Cruises</a>
    <a href="/podcast/">Podcast</a>
    <a href="https://www.patreon.com/room77" target="_blank" rel="noopener">Become a Member</a>
    <a href="/flirt/">FLIRT 2027</a>
    <a href="/sin/">SIN 2026</a>
    <a href="/contact/">Contact Us</a>
  </div>
</nav>

<main class="nf">
  <div class="nf-grid">
    <div>
      <p class="nf-code">404</p>
      <h1>Even Muchacho couldn't sniff this one out.</h1>
      <p class="lead">The page you wanted wandered off. Let's get you back to the good stuff.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Take me home
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
        <a class="btn btn-secondary" href="/podcast/">The Podcast</a>
        <a class="btn btn-secondary" href="/travel/">Book a Trip</a>
      </div>
    </div>
    <div class="nf-photo">
      <img src="/assets/muchacho.jpg" alt="Muchacho, the Room 77 beach dog, on Isla Mujeres">
      <p class="nf-cap">Muchacho, holding down the fort.</p>
    </div>
  </div>
</main>
<script>(function(){var t=document.querySelector('.nav-toggle'),l=document.getElementById('navlinks');if(t&&l){t.addEventListener('click',function(){var o=l.classList.toggle('open');t.setAttribute('aria-expanded',o);});}})();</script>
</body>
</html>
